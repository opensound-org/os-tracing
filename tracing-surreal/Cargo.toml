[package]
name = "tracing-surreal"
authors = ["29 <791603901@qq.com>"]
version = "0.0.1"
license = "MIT/Apache-2.0"
readme = "README.md"
keywords = ["serde", "async", "message", "logging", "diagnostics"]
categories = ["data-structures", "development-tools::debugging", "development-tools::profiling", "encoding", "web-programming::websocket"]
repository = "https://github.com/opensound-org/tracing-surreal"
homepage = "https://github.com/opensound-org/tracing-surreal"
description = """
🚧 A tracing Layer that can forward all tracing data to SurrealDB (WIP, nothing usable for now).
"""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Because we are using 2024 Edition.
# 因为我们正在使用2024 Edition。
# https://blog.rust-lang.org/2025/02/20/Rust-1.85.0.html
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
derive_more = { version = "2.0.1", features = ["display", "from_str"] }
either = { version = "1.15.0", features = ["serde"] }
est = { version = "0.9.0", features = ["result", "serde", "signal", "task", "task_tracker", "thread"] }
futures = "0.3.31"
indexmap = { version = "2.9.0", features = ["serde"] }
mac_address = "1.1.8"
rmp-serde = "1.3.0"
ron = "0.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
serde_qs = { version = "0.15.0", features = ["indexmap"] }
serde_with = "3.12.0"
surrealdb = "2.3.0"
sysinfo = "0.33.1"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = "0.26.1"
tokio-util = { version = "0.7.13", features = ["rt", "time"] }
tracing = "0.1.41"
tracing-core = "0.1.33"
tracing-subscriber = "0.3.19"
trait-variant = "0.1.2"
ulid = "1.1.4"
wgpu =  { version = "23.0.1", features = ["serde"] }

[dev-dependencies]

[build-dependencies]
version_check = "0.9.5"
